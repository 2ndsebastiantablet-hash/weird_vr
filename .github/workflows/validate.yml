name: Validate WebXR project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node --check gorilla-locomotion-web.js
          node --check complex-data.js
          node --check complex-batch3.js
          node --check complex-renderer.js
          node --check complex-batch3-renderer.js
          node --check procedural-complex.js
          node --check gameplay.js
          node --check multiplayer.js

      - name: Verify pinned locomotion source
        run: |
          test "$(git hash-object gorilla-locomotion-web.js)" = "94974d406cc880f5741f3e15e94dca2ee923947b"

      - name: Verify all three modular piece batches
        run: |
          for piece in spawnHub shortStraight mediumStraight longStraight cornerHall tJunction fourWay smallRoom pillarRoom steppingRoom rampUp wallCap; do
            grep -q "$piece" complex-data.js
          done
          for piece in offsetSHall zigzagHall pillarHall windowedHall lowBeamHall splitLevelHall wideTJunction offsetCrossroads forkJunction doubleHallLoop ringJunction brokenCrossroads; do
            grep -q "$piece" complex-data.js
          done
          for piece in longChamber storageBlockRoom sunkenFloorRoom raisedRingRoom twinChamber dividerRoom observationRoom columnForestRoom darkRoom emergencyLightRoom checkerArena collapsedRoom; do
            grep -q "$piece" complex-batch3.js
          done
          grep -q 'placeFeatureBatch' complex-data.js
          grep -q 'replaceCapWithPiece' complex-batch3.js
          grep -q 'collisionPolicy:"all-gameplay-geometry"' procedural-complex.js

      - name: Verify deterministic procedural layouts
        run: |
          node <<'NODE'
          global.window = {};
          require("./complex-data.js");
          require("./complex-batch3.js");
          const data = window.WEIRD_VR_COMPLEX_DATA;
          const first = data.buildLayout("deadbeef");
          const second = data.buildLayout("deadbeef");
          const firstIds = first.pieces.map(piece => piece.definition.id);
          const secondIds = second.pieces.map(piece => piece.definition.id);
          if (JSON.stringify(firstIds) !== JSON.stringify(secondIds)) throw new Error("Seed output changed between generations");
          if (!firstIds.includes("spawnHub")) throw new Error("Spawn Hub missing");
          if (!firstIds.includes("rampUp")) throw new Error("Ramp Up missing");
          if (!firstIds.includes("wallCap")) throw new Error("Wall Cap missing");
          for (const id of data.SECOND_BATCH_IDS) {
            if (!firstIds.includes(id)) throw new Error("Second-batch piece missing: " + id);
          }
          const thirdPlaced = data.THIRD_BATCH_IDS.filter(id => firstIds.includes(id));
          if (thirdPlaced.length < 6) throw new Error("Too few third-batch pieces placed: " + thirdPlaced.length);
          if (first.monsterSpawns.length < 6) throw new Error("Not enough generated monster spawns");
          NODE

      - name: Verify collision-first renderer
        run: |
          grep -q 'runtimeColliderRecords' complex-renderer.js
          grep -q 'installColliderData' complex-renderer.js
          grep -q 'registerSolid' complex-renderer.js
          grep -q 'element.dataset.weirdSolid="true"' complex-renderer.js
          grep -q 'component.colliders=active' complex-renderer.js
          grep -q 'root.dataset.collisionReady' complex-renderer.js
          grep -q 'refreshCollisions' complex-renderer.js
          grep -q 'extensionColliderRecords' complex-batch3-renderer.js
          grep -q 'installCollider' complex-batch3-renderer.js
          grep -q 'refreshExtensionColliders' complex-batch3-renderer.js

      - name: Verify bright map lighting
        run: |
          grep -q 'addUniversalLighting' complex-batch3-renderer.js
          grep -q 'type:ambient;color:#e5ecff;intensity:.75' complex-batch3-renderer.js
          grep -q 'type:hemisphere;color:#ffffff' complex-batch3-renderer.js
          grep -q 'emissiveIntensity:2.35' complex-batch3-renderer.js
          grep -q 'lightingMode="bright-everywhere"' complex-batch3-renderer.js
          grep -q 'pointLightCount' complex-batch3-renderer.js

      - name: Check scene and gameplay wiring
        run: |
          test -f index.html
          test -f styles.css
          test -f README.md
          test -f docs/PROCEDURAL_COMPLEX_PLAN.md
          test -f THIRD_PARTY_LICENSES/Another-Axiom-GorillaLocomotion-MIT.txt
          grep -q 'gorilla-locomotion-web.js' index.html
          grep -q 'complex-data.js' index.html
          grep -q 'complex-batch3.js' index.html
          grep -q 'complex-renderer.js' index.html
          grep -q 'complex-batch3-renderer.js' index.html
          grep -q 'procedural-complex.js' index.html
          grep -q 'gameplay.js' index.html
          grep -q 'id="match-map-complex"' index.html
          grep -q 'Black Checkered Complex' gameplay.js
          grep -q 'const mapSeed=createMapSeed()' gameplay.js
          grep -q 'generateComplex(mapSeed)' gameplay.js
          grep -q 'generated.monsterSpawns' gameplay.js
          grep -q 'gorilla-locomotion="leftHand:#left-hand;rightHand:#right-hand;head:#player-camera' index.html
          grep -q 'tracked-controls="hand:left"' index.html
          grep -q 'tracked-controls="hand:right"' index.html
          grep -q 'id="vr-game-menu"' index.html
          grep -q 'id="vr-start-match"' index.html
          grep -q 'MATCH_DURATION_MS = 4 \* 60 \* 1000' gameplay.js
          grep -q 'slice(0,6)' gameplay.js
          grep -q 'matchState:this.game.exportState()' multiplayer.js
          grep -q 'create-room-dialog' index.html
          ! grep -q 'match-map-street' index.html
          ! grep -q 'match-map-mansion' index.html
          ! grep -q 'match-map-forest' index.html
          ! grep -q 'gltf-model' index.html
          ! grep -q 'assets/maps/' index.html
