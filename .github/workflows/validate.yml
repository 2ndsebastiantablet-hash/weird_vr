name: Validate WebXR project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node --check gorilla-locomotion-web.js
          node --check forest-map.js
          node --check gameplay.js
          node --check multiplayer.js

      - name: Verify pinned locomotion source
        run: |
          test "$(git hash-object gorilla-locomotion-web.js)" = "94974d406cc880f5741f3e15e94dca2ee923947b"

      - name: Verify old complex was removed
        run: |
          test ! -f complex-data.js
          test ! -f complex-batch3.js
          test ! -f complex-renderer.js
          test ! -f complex-batch3-renderer.js
          test ! -f procedural-complex.js
          test ! -f docs/PROCEDURAL_COMPLEX_PLAN.md
          ! grep -q 'Black Checkered Complex' index.html gameplay.js README.md
          ! grep -q 'match-map-complex' index.html gameplay.js

      - name: Verify authored forest map
        run: |
          test -f forest-map.js
          grep -q 'const ROOT_ID="match-map-forest"' forest-map.js
          grep -q 'Evergreen Outpost' forest-map.js gameplay.js README.md
          grep -q 'function addSky' forest-map.js
          grep -q 'function addForest' forest-map.js
          grep -q 'function addCabin' forest-map.js
          grep -q 'function addBridge' forest-map.js
          grep -q 'function addLookout' forest-map.js
          grep -q 'function addRuins' forest-map.js
          grep -q 'function addStumpCourse' forest-map.js
          grep -q 'function addBoundaries' forest-map.js
          grep -q 'compound-inspired-forest' forest-map.js
          grep -q 'monsterSpawns' forest-map.js gameplay.js

      - name: Verify forest collisions and lighting
        run: |
          grep -q 'colliderRecords' forest-map.js
          grep -q 'installCollider' forest-map.js
          grep -q 'registerSolid' forest-map.js
          grep -q 'locomotion.colliders=active' forest-map.js
          grep -q 'root.dataset.collisionReady' forest-map.js
          grep -q 'scene.addEventListener("enter-vr"' forest-map.js
          grep -q 'type:ambient;color:#d8efff;intensity:.8' forest-map.js
          grep -q 'type:hemisphere;color:#f5fbff' forest-map.js
          grep -q 'type:directional;color:#fff5c7' forest-map.js
          grep -q 'castShadow:false' forest-map.js

      - name: Verify nonblocking startup
        run: |
          grep -q 'scene.hasLoaded||scene.isPlaying' app.js
          grep -q 'setTimeout(startMultiplayer,3500)' app.js
          grep -q 'let started=false' app.js
          ! grep -q 'ensureBuilt()' app.js

      - name: Check scene and gameplay wiring
        run: |
          test -f index.html
          test -f styles.css
          test -f README.md
          test -f THIRD_PARTY_LICENSES/Another-Axiom-GorillaLocomotion-MIT.txt
          grep -q 'gorilla-locomotion-web.js' index.html
          grep -q 'forest-map.js' index.html
          grep -q 'gameplay.js' index.html
          grep -q 'id="match-map-forest"' index.html
          grep -q 'const mapId="forest"' gameplay.js
          grep -q 'ensureForest()' gameplay.js
          grep -q 'refreshForestCollisions()' gameplay.js
          grep -q 'gorilla-locomotion="leftHand:#left-hand;rightHand:#right-hand;head:#player-camera' index.html
          grep -q 'tracked-controls="hand:left"' index.html
          grep -q 'tracked-controls="hand:right"' index.html
          grep -q 'id="vr-game-menu"' index.html
          grep -q 'id="vr-start-match"' index.html
          grep -q 'MATCH_DURATION_MS = 4 \* 60 \* 1000' gameplay.js
          grep -q 'slice(0,6)' gameplay.js
          grep -q 'matchState:this.game.exportState()' multiplayer.js
          grep -q 'create-room-dialog' index.html
          ! grep -q 'complex-data.js' index.html
          ! grep -q 'complex-renderer.js' index.html
          ! grep -q 'procedural-complex.js' index.html
          ! grep -q 'gltf-model' index.html
