name: Validate WebXR project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node --check gorilla-locomotion-web.js
          node --check procedural-complex.js
          node --check gameplay.js
          node --check multiplayer.js

      - name: Verify pinned locomotion source
        run: |
          test "$(git hash-object gorilla-locomotion-web.js)" = "94974d406cc880f5741f3e15e94dca2ee923947b"

      - name: Verify first modular piece batch
        run: |
          grep -q 'id: "spawnHub"' procedural-complex.js
          grep -q 'id: "shortStraight"' procedural-complex.js
          grep -q 'id: "mediumStraight"' procedural-complex.js
          grep -q 'id: "longStraight"' procedural-complex.js
          grep -q 'id: "cornerHall"' procedural-complex.js
          grep -q 'id: "tJunction"' procedural-complex.js
          grep -q 'id: "fourWay"' procedural-complex.js
          grep -q 'id: "smallRoom"' procedural-complex.js
          grep -q 'id: "pillarRoom"' procedural-complex.js
          grep -q 'id: "steppingRoom"' procedural-complex.js
          grep -q 'id: "rampUp"' procedural-complex.js
          grep -q 'id: "wallCap"' procedural-complex.js
          grep -q 'CEILING_THICKNESS' procedural-complex.js
          grep -q 'function addFloorAndCeiling' procedural-complex.js
          grep -q 'height + 0.35' procedural-complex.js
          grep -q 'refreshLocomotionColliders' procedural-complex.js

      - name: Verify deterministic procedural layouts
        run: |
          node <<'NODE'
          global.window = {};
          global.document = {readyState: "loading", addEventListener() {}};
          require("./procedural-complex.js");
          const api = window.WEIRD_VR_COMPLEX;
          const first = api.inspect("deadbeef");
          const second = api.inspect("deadbeef");
          if (JSON.stringify(first) !== JSON.stringify(second)) throw new Error("Seed output changed between generations");
          if (!first.pieceIds.includes("spawnHub")) throw new Error("Spawn Hub missing");
          if (!first.pieceIds.includes("rampUp")) throw new Error("Ramp Up missing");
          if (!first.pieceIds.includes("wallCap")) throw new Error("Wall Cap missing");
          if (first.pieceCount < 24 || first.pieceCount > 44) throw new Error("Unexpected map size: " + first.pieceCount);
          if (first.monsterSpawns.length < 6) throw new Error("Not enough generated monster spawns");
          NODE

      - name: Check procedural map foundation
        run: |
          test -f index.html
          test -f styles.css
          test -f README.md
          test -f docs/PROCEDURAL_COMPLEX_PLAN.md
          test -f THIRD_PARTY_LICENSES/Another-Axiom-GorillaLocomotion-MIT.txt
          grep -q 'gorilla-locomotion-web.js' index.html
          grep -q 'procedural-complex.js' index.html
          grep -q 'gameplay.js' index.html
          grep -q 'id="match-map-complex"' index.html
          grep -q 'Black Checkered Complex' gameplay.js
          grep -q 'const mapSeed=createMapSeed()' gameplay.js
          grep -q 'generateComplex(mapSeed)' gameplay.js
          grep -q 'generated.monsterSpawns' gameplay.js
          grep -q 'complex-checker-texture' procedural-complex.js
          grep -q 'GRID_UNIT = 6' procedural-complex.js
          grep -q 'locomotion-collider' procedural-complex.js
          ! grep -q 'match-map-street' index.html
          ! grep -q 'match-map-mansion' index.html
          ! grep -q 'match-map-forest' index.html
          ! grep -q 'gltf-model' index.html
          ! grep -q 'assets/maps/' index.html

      - name: Check gameplay and controller wiring
        run: |
          grep -q 'gorilla-locomotion="leftHand:#left-hand;rightHand:#right-hand;head:#player-camera' index.html
          grep -q 'tracked-controls="hand:left"' index.html
          grep -q 'tracked-controls="hand:right"' index.html
          grep -q 'id="vr-game-menu"' index.html
          grep -q 'id="vr-start-match"' index.html
          grep -q 'MATCH_DURATION_MS = 4 \* 60 \* 1000' gameplay.js
          grep -q 'slice(0,6)' gameplay.js
          grep -q 'matchState:this.game.exportState()' multiplayer.js
          grep -q 'create-room-dialog' index.html
